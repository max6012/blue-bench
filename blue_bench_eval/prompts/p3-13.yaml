id: p3-13
category: credential_access
title: Pass-the-hash / stolen-token use?
question: |
  Any sign that stolen credentials or hashes are being reused to authenticate —
  e.g. an NTLM network logon for a privileged account from a host it has no
  business coming from? If so, which account, which target, and which source?
expected_tools:
  - search_auth_events
  - count_by_field
expected_findings:
  - synonyms: ["pass-the-hash", "pass the hash", "PtH", "NTLM", "NtLmSsp", "T1550.002"]
  - synonyms: ["Type 3", "LogonType 3", "network logon"]
  - synonyms: ["corp-admin", "privileged account", "administrator"]
  - synonyms: ["srv-files-01", "file server", "target"]
  - synonyms: ["wkst-11", "unexpected source", "unusual source host"]
  - synonyms: ["special privileges", "4672", "privilege assignment"]
pass_criteria: Identifies the pass-the-hash into srv-files-01 — a Type-3 NTLM network logon for the privileged corp-admin account from an unexpected source (wkst-11), followed by special-privilege assignment — grounded in the NTLM logon-type + source anomaly.
tags: [tier1, credential_access, pth, auth]
max_turns: 20
tier: 1
