id: p3-18
category: retrohunt
title: Retrohunt an atomic indicator
question: |
  We have an indicator of interest: a registry Run-key value named
  "Atomic Red Team". Sweep the environment for it — which hosts show this
  indicator, and for each, what's the surrounding activity that came with it?
  Don't stop at the first hit.
expected_tools:
  - get_process_events
  - count_by_field
  - get_process_tree
expected_findings:
  - synonyms: ["Atomic Red Team", "Run key", "registry run key", "T1547.001"]
  - synonyms: ["wkst-03", "WKST-03"]
  - synonyms: ["wkst-07", "WKST-07"]
  - synonyms: ["two hosts", "both hosts", "multiple hosts", "more than one"]
  - synonyms: ["surrounding activity", "LSASS", "download cradle", "context", "kill chain"]
pass_criteria: Pivots on the Run-key value and finds it on BOTH wkst-03 and wkst-07 (not just one), and characterizes the surrounding activity on each, grounded in the registry + process evidence.
tags: [tier2, retrohunt, ioc, sysmon]
max_turns: 30
tier: 2
