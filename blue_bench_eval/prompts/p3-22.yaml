id: p3-22
category: ot_segment
title: Baseline the OT segment for anomaly detection
question: |
  Establish a normal-behavior baseline for the OT/plant segment: which devices
  talk to which, over what protocols, and at what cadence. Describe it so that a
  future deviation from this baseline could be detected.
expected_tools:
  - count_by_field
  - get_connections
expected_findings:
  - synonyms: ["Modbus", "port 502", "DNP3", "port 20000", "IEC-104", "port 2404", "S7comm", "port 102"]
  - synonyms: ["HMI", "historian", "engineering workstation", "controller", "PLC", "RTU"]
  - synonyms: ["polling", "cyclic", "periodic", "cadence", "steady rate", "master-to-outstation"]
  - synonyms: ["baseline", "normal pattern", "which talks to which", "expected flows"]
pass_criteria: Characterizes the OT baseline — the protocols/ports in use, the device roles, and the regular polling flows/cadence — in a form usable to spot future deviations.
tags: [tier2, ot_segment, baseline, ics]
max_turns: 30
tier: 2
